name: Build apps

# Every push to main builds an Android APK and an iPhone IPA and publishes them
# as a GitHub release (version 1.0.<run number>). Public repos build for free.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # Type check and logic tests run alongside the builds, so a small type error never blocks a build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Align native package versions with the Expo SDK
        run: npx expo install --fix
      - run: npx tsc --noEmit
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx expo install --fix
      - run: node scripts/set-version.mjs
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: cp android/app/build/outputs/apk/release/app-release.apk OpenPlate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OpenPlate.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --fix
      - run: node scripts/set-version.mjs
      - name: Generate the Xcode project (also runs pod install)
        run: npx expo prebuild --platform ios --clean
      - name: Drop the push entitlement (free Apple IDs cannot sign it; local notifications still work)
        run: |
          for f in ios/*/*.entitlements; do /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" || true; done
      - name: Build unsigned app
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/app.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60
          test ${PIPESTATUS[0]} -eq 0
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qry OpenPlate.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: OpenPlate.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - id: v
        run: echo "version=$(node scripts/set-version.mjs)" >> "$GITHUB_OUTPUT"
      - run: node scripts/make-source.mjs OpenPlate.ipa "${{ steps.v.outputs.version }}" "${{ github.repository }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" OpenPlate.apk OpenPlate.ipa source.json \
            --title "OpenPlate ${{ steps.v.outputs.version }}" \
            --notes "Android: download OpenPlate.apk on your phone and install it. iPhone: update in SideStore (source: https://github.com/${{ github.repository }}/releases/latest/download/source.json) or install OpenPlate.ipa. Built from ${GITHUB_SHA::7}." \
            --latest
